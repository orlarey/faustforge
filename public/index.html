<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>faustforge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-brand">
      <h1>FAUSTFORGE</h1>
      <span id="header-app-version">v1.0.0</span>
    </div>
    <div class="header-nav">
      <button id="session-prev" class="icon-btn" title="Previous session">◀</button>
      <div id="session-label">Empty</div>
      <span id="session-order-indicator" class="session-order-indicator" title="Order: Chronological">⏱</span>
      <button id="session-next" class="icon-btn" title="Next session">▶</button>
    </div>
    <div class="header-controls">
      <button id="refresh-session" class="icon-btn hidden" title="Refresh session" aria-label="Refresh session">↻</button>
      <button id="edit-session" class="icon-btn hidden" title="Edit session" aria-label="Edit session">✎</button>
      <label class="header-pill header-view-pill" title="View">
        <span>View</span>
        <select id="view-select" aria-label="View"></select>
      </label>
      <button id="delete-session" class="icon-btn" title="Delete session" aria-label="Delete session">🗑</button>
      <input type="file" id="file-input" accept=".dsp" hidden>
      <button id="archive-btn" class="primary-btn" title="Archive DSP" aria-label="Archive DSP">Archive</button>
      <button id="download-btn" class="primary-btn" title="Download" aria-label="Download">Download</button>
    </div>
  </header>

  <main>

    <!-- Overlay de drop (pleine page) -->
    <div id="drop-overlay" class="hidden">
      <div class="drop-overlay-content">
        <span class="drop-icon">↓</span>
        <p>Drop <code>.dsp</code> file</p>
      </div>
    </div>

    <!-- Overlay de chargement -->
    <div id="loading-overlay" class="hidden">
      <span class="loading-text">Compiling...</span>
    </div>

    <!-- Bandeau d'erreur -->
    <div id="error-banner" class="hidden"></div>

    <!-- Conteneur pour la vue active -->
    <div id="view-container" class="hidden"></div>
  </main>

  <footer>
    <span id="footer-version">v0.1</span>
  </footer>

  <div id="audio-gate" class="audio-gate hidden" role="dialog" aria-modal="true" aria-labelledby="audio-gate-title">
    <div class="audio-gate-card">
      <h2 id="audio-gate-title">WELCOME TO FAUSTFORGE</h2>
      <p>Design, compile, and perform Faust programs in one workspace. Use AI tools via MCP to assist your design workflow.</p>
      <button id="audio-gate-button" class="primary-btn">ENTER</button>
      <div id="audio-gate-status" class="audio-gate-status hidden"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
